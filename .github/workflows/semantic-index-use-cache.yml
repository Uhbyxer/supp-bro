name: Use Semantic Index Cache

on:
  workflow_dispatch:

jobs:
  use-semantic-index-cache:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compute FAISS cache key
        id: cache-key
        run: |
          cache_hash="$(
            sha256sum \
              requirements.txt \
              scripts/hw2/build_index.py \
              data/hw1/processed/chunks_large.jsonl \
              data/hw1/processed/chunks_medium.json |
            sha256sum |
            cut -d ' ' -f 1
          )"
          echo "key=faiss-${{ runner.os }}-py${PYTHON_VERSION}-${EMBEDDING_MODEL}-${cache_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore FAISS index cache
        id: faiss-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hw2/index/faiss.index
            data/hw2/processed/embeddings.npy
            data/hw2/processed/chunks_for_retrieval.jsonl
          key: ${{ steps.cache-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Install dependencies
        run: make setup

      - name: Check semantic search
        env:
          FAISS_SEARCH_SUMMARY_PATH: data/hw2/output/faiss_semantic_search_summary.md
        run: make semantic-search > data/hw2/output/faiss_semantic_search_output.txt

      - name: Add FAISS semantic search table to job summary
        run: cat data/hw2/output/faiss_semantic_search_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FAISS semantic search output
        uses: actions/upload-artifact@v4
        with:
          name: faiss-semantic-search-output
          path: |
            data/hw2/output/faiss_semantic_search_output.txt
            data/hw2/output/faiss_semantic_search_summary.md
