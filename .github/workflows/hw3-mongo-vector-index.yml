name: Build HW3 Mongo Vector Index

on:
  workflow_dispatch:

jobs:
  build-hw3-mongo-vector-index:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: supp-bro
      MONGODB_COLLECTION: chunks
      MONGODB_VECTOR_INDEX: vector_index

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: make setup

      - name: Build MongoDB Atlas vector index
        run: make build-mongo-index

      - name: Check MongoDB Atlas semantic search
        run: make mongo-semantic-search > data/hw2/output/mongo_semantic_search_output.txt

      - name: Upload MongoDB semantic search output
        uses: actions/upload-artifact@v4
        with:
          name: mongo-semantic-search-output
          path: data/hw2/output/mongo_semantic_search_output.txt
