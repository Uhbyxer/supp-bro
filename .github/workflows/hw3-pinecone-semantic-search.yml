name: Check HW3 Pinecone Semantic Search

on:
  workflow_dispatch:
    inputs:
      source:
        description: Limit Pinecone retrieval to a source (empty searches all sources)
        required: false
        type: choice
        default: ""
        options:
          - ""
          - pages
          - issues

jobs:
  check-hw3-pinecone-semantic-search:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX: supp-bro
      PINECONE_NAMESPACE: hw3-pinecone-vector
      PINECONE_SOURCE: ${{ inputs.source }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: make setup

      - name: Check Pinecone semantic search
        env:
          PINECONE_SEARCH_SUMMARY_PATH: data/hw2/output/pinecone_semantic_search_summary.md
        run: make pinecone-semantic-search > data/hw2/output/pinecone_semantic_search_output.txt

      - name: Add Pinecone semantic search table to job summary
        run: cat data/hw2/output/pinecone_semantic_search_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pinecone semantic search output
        uses: actions/upload-artifact@v4
        with:
          name: pinecone-semantic-search-output
          path: |
            data/hw2/output/pinecone_semantic_search_output.txt
            data/hw2/output/pinecone_semantic_search_summary.md
