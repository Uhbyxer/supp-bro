name: Check HW3 Mongo Semantic Search

on:
  workflow_dispatch:

jobs:
  check-hw3-mongo-semantic-search:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: supp-bro
      MONGODB_COLLECTION: chunks
      MONGODB_VECTOR_INDEX: vector_index

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: make setup

      - name: Check MongoDB Atlas semantic search
        env:
          MONGODB_SEARCH_SUMMARY_PATH: data/hw2/output/mongo_semantic_search_summary.md
        run: make mongo-semantic-search > data/hw2/output/mongo_semantic_search_output.txt

      - name: Add MongoDB semantic search table to job summary
        run: cat data/hw2/output/mongo_semantic_search_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MongoDB semantic search output
        uses: actions/upload-artifact@v4
        with:
          name: mongo-semantic-search-output
          path: |
            data/hw2/output/mongo_semantic_search_output.txt
            data/hw2/output/mongo_semantic_search_summary.md
