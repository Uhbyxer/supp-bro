name: Evaluate HW3 Pinecone Retrieval

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  evaluate-hw3-pinecone-retrieval:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.11"
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX: supp-bro
      PINECONE_NAMESPACE: hw3-pinecone-vector
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download previous successful evaluation
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "hw3-pinecone-retrieval-evaluation.yml",
              status: "success",
              per_page: 20
            });
            const previousRun = runs.find(run => run.id !== context.runId);
            if (!previousRun) {
              core.notice("No previous successful workflow run found.");
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: previousRun.id,
              per_page: 100
            });
            const artifact = artifacts.find(item => item.name === "pinecone-retrieval-evaluation" && !item.expired);
            if (!artifact) {
              core.notice("Previous successful run has no usable evaluation artifact.");
              return;
            }
            const archive = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: "zip"
            });
            fs.writeFileSync("previous-retrieval.zip", Buffer.from(archive.data));
            core.notice(`Using evaluation artifact from run ${previousRun.id}.`);
      - name: Extract previous evaluation
        run: |
          mkdir -p data/hw3/previous
          if [ -f previous-retrieval.zip ]; then
            unzip -o previous-retrieval.zip -d data/hw3/previous
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: make setup
      - name: Compare baseline and improved retrieval
        run: make pinecone-retrieval-evaluation
      - name: Add comparison to job summary
        if: always()
        run: cat data/hw3/output/pinecone_retrieval_evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinecone-retrieval-evaluation
          path: |
            data/hw3/output/pinecone_retrieval_evaluation.json
            data/hw3/output/pinecone_retrieval_evaluation.md
