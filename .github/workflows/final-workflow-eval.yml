name: Final Workflow Eval

on:
  workflow_dispatch:
    inputs:
      min_vector_score:
        description: "Minimum vector score passed to final RAG calls"
        required: true
        default: "0.30"
        type: string

jobs:
  workflow-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic workflow eval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ vars.PINECONE_INDEX || 'supp-bro' }}
          PINECONE_NAMESPACE: ${{ vars.PINECONE_NAMESPACE || 'hw3-pinecone-vector' }}
        run: python scripts/final/evals/run_workflow_eval.py --min-vector-score "${{ inputs.min_vector_score }}"

      - name: Add deterministic table to job summary
        if: always()
        run: |
          if [ -f scripts/final/outputs/eval_summary.md ]; then
            cat scripts/final/outputs/eval_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload deterministic eval outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-workflow-eval
          path: |
            scripts/final/outputs/eval_workflow_results.csv
            scripts/final/outputs/eval_summary.md
            scripts/final/outputs/ragas_input.json
