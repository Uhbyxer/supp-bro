name: Final Workflow Eval

on:
  workflow_dispatch:
    inputs:
      run_ragas:
        description: "Run optional RAGAS LLM-as-judge eval"
        required: true
        default: false
        type: boolean
      disable_rag:
        description: "Disable local RAG for smoke/debug runs"
        required: true
        default: false
        type: boolean
      min_vector_score:
        description: "Minimum vector score passed to final RAG calls"
        required: true
        default: "0.30"
        type: string

jobs:
  workflow-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run final workflow regression eval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ vars.PINECONE_INDEX || 'supp-bro' }}
          PINECONE_NAMESPACE: ${{ vars.PINECONE_NAMESPACE || 'hw3-pinecone-vector' }}
        run: |
          args=(--min-vector-score "${{ inputs.min_vector_score }}")
          if [ "${{ inputs.disable_rag }}" = "true" ]; then
            args+=(--disable-rag)
          fi
          python scripts/final/evals/run_workflow_eval.py "${args[@]}"

      - name: Install optional RAGAS dependencies
        if: ${{ inputs.run_ragas }}
        run: pip install ragas datasets

      - name: Run optional RAGAS eval
        if: ${{ inputs.run_ragas }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/final/evals/run_ragas_eval.py

      - name: Add metric tables to job summary
        if: always()
        run: |
          if [ -f scripts/final/outputs/eval_summary.md ]; then
            cat scripts/final/outputs/eval_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          echo '## RAGAS metrics' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f scripts/final/outputs/eval_ragas_results.csv ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          from pathlib import Path

          path = Path('scripts/final/outputs/eval_ragas_results.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8')))
          if rows and 'status' in rows[0]:
              print('| Status | Reason |')
              print('|---|---|')
              for row in rows:
                  print(f"| {row.get('status', '')} | {row.get('reason', '')} |")
          elif rows:
              metric_names = [name for name in ('faithfulness', 'answer_relevancy', 'context_precision') if name in rows[0]]
              print('| Metric | Average |')
              print('|---|---:|')
              for metric in metric_names:
                  values = [float(row[metric]) for row in rows if row.get(metric) not in (None, '', 'nan')]
                  average = sum(values) / len(values) if values else float('nan')
                  print(f'| {metric} | {average:.3f} |')
          else:
              print('| Status | Reason |')
              print('|---|---|')
              print('| no results | RAGAS produced no rows |')
          PY
          else
            echo '| Status | Reason |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
            echo '| not run | RAGAS was disabled for this run |' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final workflow eval outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-workflow-eval
          path: scripts/final/outputs/
