name: Run HW4 Grounded RAG Answer
on:
  workflow_dispatch:
    inputs:
      question: {description: Question to answer, required: true, type: string}
      source:
        {description: Limit retrieval source, required: false, type: choice, default: "", options: ["", pages, issues]}
      prompt_flavor:
        {description: Prompt flavor for single mode, required: true, type: choice, default: strong, options: [strong, weak]}
      post_validator:
        {description: Post-validate model citations in single mode, required: true, type: choice, default: "on", options: ["on", "off"]}
      min_vector_score:
        {description: Minimum best vector score before calling the LLM, required: true, type: number, default: 0.30}
      mode:
        {description: Run one configuration or the 4-way experiment matrix, required: true, type: choice, default: single, options: [single, experiment]}
permissions: {contents: read}
jobs:
  answer:
    runs-on: ubuntu-latest
    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_INDEX: supp-bro
      PINECONE_NAMESPACE: hw3-pinecone-vector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: make setup
      - run: .venv/bin/python -m unittest scripts/hw4/test_rag_answer.py
      - name: Generate grounded answer
        env:
          QUESTION: ${{ inputs.question }}
          SOURCE: ${{ inputs.source }}
          MIN_VECTOR_SCORE: ${{ inputs.min_vector_score }}
          PROMPT_FLAVOR: ${{ inputs.prompt_flavor }}
          POST_VALIDATOR: ${{ inputs.post_validator }}
          MODE: ${{ inputs.mode }}
        run: |
          args=("$QUESTION")
          if [[ -n "$SOURCE" ]]; then args+=(--source "$SOURCE"); fi
          if [[ "$MODE" == "experiment" ]]; then
            args+=(--experiment)
          else
            args+=(--prompt-flavor "$PROMPT_FLAVOR" --post-validator "$POST_VALIDATOR" --min-vector-score "$MIN_VECTOR_SCORE")
          fi
          .venv/bin/python scripts/hw4/rag_answer.py "${args[@]}" | tee hw4-rag-answer.json
      - if: always()
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat hw4-rag-answer.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("hw4-rag-answer.json").read_text())
          if data.get("summary_markdown"):
              print("\n## Experiment summary\n")
              print(data["summary_markdown"])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: hw4-rag-answer, path: hw4-rag-answer.json}
